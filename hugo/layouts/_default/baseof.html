<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .Title }}{{ .Title }}{{ if not .IsHome }} | CoreScale{{ end }}{{ else }}CoreScale{{ end }}</title>
{{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="CoreScale">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .Title }}{{ .Title }}{{ else }}CoreScale{{ end }}">
{{ with .Description }}<meta property="og:description" content="{{ . }}">{{ end }}
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "og-image.png" | absURL }}">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .Title }}{{ .Title }}{{ else }}CoreScale{{ end }}">
{{ with .Description }}<meta name="twitter:description" content="{{ . }}">{{ end }}
<meta name="twitter:image" content="{{ "og-image.png" | absURL }}">
{{ if .IsHome }}<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "CoreScale",
  "description": {{ site.Params.description | jsonify }},
  "url": {{ site.BaseURL | jsonify }},
  "logo": {{ "corescale-logo.png" | absURL | jsonify }},
  "image": {{ "og-image.png" | absURL | jsonify }},
  "email": "core@cscale.com.br",
  "telephone": "+55 11 91646-4113",
  "areaServed": "BR",
  "knowsAbout": ["Migração para AWS", "FinOps", "Operação gerenciada 24/7", "Segurança e conformidade", "Observabilidade", "IA generativa na AWS"]
}
</script>
<link rel="stylesheet" href="/css/cinematic.css">
<link rel="preload" as="image" href="/media/scene-migration.webp" imagesrcset="/media/scene-migration-mobile.webp 1080w, /media/scene-migration.webp 2048w" imagesizes="100vw">
{{ end }}
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1A2333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#1A2333;font-family:'Manrope',system-ui,sans-serif;color:#E9EDF5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
::selection{background:#FF9900;color:#0A1322}
@keyframes rmMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rmBlink{50%{opacity:0}}
@keyframes rmPulse{0%,100%{opacity:1}50%{opacity:.35}}
.rm-submenu{display:none}
.rm-hasmenu:hover .rm-submenu{display:flex}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important}}
@media (max-width:1000px){
.rm-nav{display:none !important}
#rm-burger{display:flex !important}
.rm-hero{grid-template-columns:1fr !important}
.rm-split{grid-template-columns:1fr !important}
.rm-bento{grid-template-columns:repeat(2,1fr) !important}
.rm-metrics{grid-template-columns:repeat(2,1fr) !important}
.rm-blog{grid-template-columns:repeat(2,1fr) !important}
.rm-grid{grid-template-columns:repeat(2,1fr) !important}
.rm-g3{grid-template-columns:1fr !important}
.rm-g4{grid-template-columns:repeat(2,1fr) !important}
.rm-g2{grid-template-columns:1fr !important}
.rm-feat{grid-template-columns:1fr !important}
.rm-tilewide{grid-column:auto !important}
.rm-tiletall{grid-row:auto !important}
}
@media (max-width:680px){
.rm-bento{grid-template-columns:1fr !important}
.rm-blog{grid-template-columns:1fr !important}
.rm-grid{grid-template-columns:1fr !important}
.rm-g4{grid-template-columns:1fr !important}
.rm-metrics{grid-template-columns:1fr !important}
.rm-pad{padding-left:20px !important;padding-right:20px !important}
}
</style>
</head>
<body>
{{ block "main" . }}{{ end }}
<script>
document.addEventListener('DOMContentLoaded',function(){
  function bind(attr,enter,leave){
    document.querySelectorAll('['+attr+']').forEach(function(el){
      var base=el.getAttribute('style')||'';
      var ov=el.getAttribute(attr);
      el.addEventListener(enter,function(){el.setAttribute('style',base+';'+ov);});
      el.addEventListener(leave,function(){el.setAttribute('style',base);});
    });
  }
  bind('data-hover','mouseenter','mouseleave');
  bind('data-focus','focus','blur');
  // Mobile menu toggle
  var burger=document.getElementById('rm-burger');
  var mobileNav=document.getElementById('rm-mobile-nav');
  if(burger&&mobileNav){
    burger.addEventListener('click',function(){
      var open=mobileNav.style.display==='flex';
      mobileNav.style.display=open?'none':'flex';
      burger.innerHTML=open?'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>':'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    });
    mobileNav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){mobileNav.style.display='none';burger.innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';});});
  }
  document.querySelectorAll('[data-contact-form]').forEach(function(f){
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var g=function(n){return (f.elements[n]&&f.elements[n].value||'').trim();};
      var nome=g('nome'),email=g('email'),tel=g('telefone');
      if(!nome||!email||!tel){return;}
      var btn=f.querySelector('button[type="submit"]');
      var origText=btn.textContent;
      btn.textContent='Enviando...';
      btn.disabled=true;
      fetch('https://98wsgzys1j.execute-api.us-east-1.amazonaws.com/contact',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:nome,email:email,phone:tel,website:''})
      }).then(function(r){return r.json();}).then(function(d){
        btn.textContent='✓ Enviado com sucesso!';
        btn.style.background='#16a34a';
        f.reset();
        setTimeout(function(){btn.textContent=origText;btn.style.background='';btn.disabled=false;},4000);
      }).catch(function(){
        btn.textContent='Erro — tente novamente';
        btn.style.background='#dc2626';
        setTimeout(function(){btn.textContent=origText;btn.style.background='';btn.disabled=false;},3000);
      });
    });
  });
});
</script>
{{ if .IsHome }}
<script defer src="/js/vendor/gsap.min.js"></script>
<script defer src="/js/vendor/ScrollTrigger.min.js"></script>
<script defer src="/js/vendor/lenis.min.js"></script>
<script defer src="/js/cinematic.js"></script>
{{ end }}
</body>
</html>
