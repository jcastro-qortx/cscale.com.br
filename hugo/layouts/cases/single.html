{{ define "main" }}
{{ partial "rd-header.html" . }}
<style>
.rd-prose{color:#3A4655;font-size:16px;line-height:1.75}
.rd-prose > *:first-child{margin-top:0}
.rd-prose h2{font-size:26px;font-weight:800;letter-spacing:-0.02em;color:#101B2C;margin:40px 0 0;text-wrap:balance}
.rd-prose h3{font-size:20px;font-weight:700;color:#101B2C;margin:30px 0 0}
.rd-prose p{margin:16px 0 0}
.rd-prose ul,.rd-prose ol{margin:16px 0 0;padding-left:22px}
.rd-prose li{margin:6px 0}
.rd-prose a{color:#C77A00;font-weight:600}
.rd-prose strong{color:#101B2C}
.rd-prose blockquote{margin:24px 0 0;padding:14px 20px;border-left:3px solid #FF9900;background:#F7F5EF;color:#3A4655;border-radius:0 10px 10px 0}
.rd-prose blockquote p{margin:0}
.rd-prose code{font-family:'JetBrains Mono',monospace;font-size:0.9em;background:#F1EEE6;padding:2px 6px;border-radius:6px}
</style>
<section style="position:relative; overflow:hidden; background:linear-gradient(180deg,#1E2839,#1A2333); border-bottom:1px solid rgba(255,255,255,0.07);">
  <div style="position:absolute; top:-160px; right:-100px; width:520px; height:520px; background:radial-gradient(circle, rgba(255,153,0,0.1), transparent 64%); pointer-events:none;"></div>
  <div class="rm-pad" style="position:relative; max-width:900px; margin:0 auto; padding:clamp(44px,6vw,76px) 28px clamp(40px,5vw,60px);">
    <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#FF9900; border:1px solid rgba(255,153,0,0.35); padding:5px 11px; border-radius:999px; background:rgba(255,153,0,0.06);">{{ .Params.sector }}</span>
    <h1 style="margin:20px 0 0; font-size:clamp(30px,4vw,48px); line-height:1.06; letter-spacing:-0.035em; font-weight:800; color:#F4F7FC; text-wrap:balance;">{{ .Title }}</h1>
    <div style="margin-top:26px; display:flex; gap:28px; flex-wrap:wrap; align-items:baseline;">
      <div><div style="font-size:clamp(34px,4vw,50px); font-weight:800; letter-spacing:-0.03em; color:#FF9900; line-height:1;">{{ .Params.metric }}</div><div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(233,237,245,0.5); margin-top:8px;">{{ .Params.metricLabel }}</div></div>
    </div>
  </div>
</section>
<section style="background:#F4F2EA; padding:clamp(48px,7vw,80px) 0;">
  <div class="rm-pad" style="max-width:820px; margin:0 auto; padding:0 28px;">
    <div class="rd-prose">{{ .Content }}</div>
    <div style="margin-top:44px; padding-top:26px; border-top:1px solid #E1DCCF;"><a href="/cases/" style="font-weight:700; font-size:14.5px; color:#C77A00;">← Todos os cases</a></div>
  </div>
</section>
{{ partial "rd-cta.html" . }}
{{ partial "rd-footer.html" . }}
{{ end }}
