{{ define "main" }}
{{ partial "rd-header.html" . }}
<style>
.rd-prose{color:#3A4655;font-size:16px;line-height:1.75}
.rd-prose > *:first-child{margin-top:0}
.rd-prose h2{font-size:26px;font-weight:800;letter-spacing:-0.02em;color:#101B2C;margin:40px 0 0;text-wrap:balance}
.rd-prose h3{font-size:20px;font-weight:700;color:#101B2C;margin:30px 0 0}
.rd-prose p{margin:16px 0 0}
.rd-prose ul,.rd-prose ol{margin:16px 0 0;padding-left:22px}
.rd-prose li{margin:6px 0}
.rd-prose a{color:#C77A00;font-weight:600}
.rd-prose strong{color:#101B2C}
.rd-prose blockquote{margin:24px 0 0;padding:14px 20px;border-left:3px solid #FF9900;background:#F7F5EF;color:#3A4655;border-radius:0 10px 10px 0}
.rd-prose blockquote p{margin:0}
.rd-prose code{font-family:'JetBrains Mono',monospace;font-size:0.9em;background:#F1EEE6;padding:2px 6px;border-radius:6px}
</style>
<section style="position:relative; overflow:hidden; background:linear-gradient(180deg,#1E2839,#1A2333); border-bottom:1px solid rgba(255,255,255,0.07);">
  <div class="rm-pad" style="position:relative; max-width:820px; margin:0 auto; padding:clamp(44px,6vw,72px) 28px clamp(32px,4vw,48px);">
    <span style="font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:#FF9900;">Legal</span>
    <h1 style="margin:14px 0 0; font-size:clamp(30px,4vw,46px); line-height:1.06; letter-spacing:-0.03em; font-weight:800; color:#F4F7FC;">{{ .Title }}</h1>
    {{ with .Params.updated }}<p style="margin:14px 0 0; font-size:15px; color:rgba(233,237,245,0.55); font-family:'JetBrains Mono',monospace;">Última atualização: {{ . }}</p>{{ end }}
  </div>
</section>
<section style="background:#fff; padding:clamp(48px,7vw,80px) 0;">
  <div class="rm-pad" style="max-width:820px; margin:0 auto; padding:0 28px;">
    <div class="rd-prose">{{ .Content }}</div>
  </div>
</section>
{{ partial "rd-footer.html" . }}
{{ end }}
