stages:
  - build
  - deploy

variables:
  HUGO_VERSION: "0.163.3"
  S3_BUCKET: "cscale-website"
  CLOUDFRONT_DISTRIBUTION_ID: "E100PKYXLCMDIC"
  AWS_DEFAULT_REGION: "us-east-1"

build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends wget ca-certificates
    - wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -O /tmp/hugo.tar.gz
    - tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin/ hugo
    - hugo version
  script:
    - cd hugo
    - hugo --minify
  artifacts:
    paths:
      - hugo/public/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: amazon/aws-cli:latest
  dependencies:
    - build
  script:
    - aws s3 sync hugo/public/ s3://${S3_BUCKET}/ --delete --cache-control "max-age=300"
    - aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
