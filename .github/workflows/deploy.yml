name: Deploy CoreScale Site to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.163.3"
  AWS_REGION: "us-east-1"
  S3_BUCKET: "cscale-website"
  CLOUDFRONT_DISTRIBUTION_ID: "E100PKYXLCMDIC"

jobs:
  build-and-deploy:
    name: Build Hugo & Deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Run Site Audit Tests
        run: |
          bash tests/site-audit.sh

      - name: Build Production Site
        run: |
          cd hugo
          hugo --minify --gc --cleanDestinationDir

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Files to S3 Bucket
        run: |
          aws s3 sync hugo/public/ s3://${S3_BUCKET}/ --delete --cache-control "max-age=300"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"
